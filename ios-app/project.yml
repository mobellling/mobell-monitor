name: MobellMonitor
options:
  bundleIdPrefix: com.mobell
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # XcodeGen >= 2.44 defaults to the Xcode 16 project format (objectVersion 77),
  # which Xcode 15.x cannot open. Pin the older format so the project works on
  # both Xcode 15.4 (macos-14) and newer Xcode versions.
  projectFormat: xcode15_3
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  MobellMonitor:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobell.monitor
        PRODUCT_NAME: MobellMonitor
        MARKETING_VERSION: "1.3.2"
        CURRENT_PROJECT_VERSION: "6"
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  MobellMonitor:
    build:
      targets:
        MobellMonitor: all
    run:
      config: Release
